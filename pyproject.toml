[project]
name = "taxonomap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "p2002222", email = "baptiste.riou2@etu.univ-lyon1.fr" }
]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.5",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.ruff.format]
line-ending = "lf"


[dependency-groups]
dev = [
    "myst-parser>=4.0.1",
    "numpy>=2.2.6",
    "numpydoc>=1.10.0",
    "pandas>=2.3.3",
    "polars>=1.39.0",
    "pytest>=9.0.2",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.1.0",
]
